name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain and fetches Mathlib's cache; the default target (`QML.lean`) is the
      # legacy development, so the build itself is the next step.
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
      # The v12m top modules (`TOP` in `scripts/qbuild.py`); fails on an error, a `sorry` or a
      # line over 100 characters.
      - name: Build the v12m development
        run: python3 scripts/qbuild.py --strict
